<style>
/*
  Układ: strona w kratkę jak zeszyt, nagłówek z wykresem funkcji, dwie duże zakładki
  (matura / studia, każda z własnym kolorem) i działy jako białe kartki w kilku kolumnach
  (ich liczba zależy od szerokości ekranu, strona wypełnia szerokie monitory).
  Kolory: papier z chłodnym odcieniem, granat jako tusz, niebieski długopis (matura),
  zieleń tablicy (studia), czerwony długopis nauczyciela tylko na znaczniku "nowe".
  Kroje: STIX Two Text (skład naukowy) do nagłówków, IBM Plex Sans do tekstu, IBM Plex Mono do etykiet.
*/
:root {
  --bg: #f5f7fb;
  --grid: rgba(36, 72, 160, 0.075);
  --surface: #ffffff;
  --ink: #131a2a;
  --ink-2: #4a556b;
  --line: #d9e0ec;
  --on-accent: #ffffff;
  --pen: #c8312b;
  --acc-matura: #2447c4;
  --acc-matura-soft: #e8eefc;
  --acc-studia: #0f6b57;
  --acc-studia-soft: #e1f2ed;
  --accent: var(--acc-matura);
  --accent-soft: var(--acc-matura-soft);
  --shadow: 0 1px 2px rgba(19, 26, 42, 0.06);
  --f-display: "STIX Two Text", "Latin Modern Roman", "Times New Roman", Georgia, serif;
  --f-body: "IBM Plex Sans", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1320;
    --grid: rgba(140, 170, 255, 0.07);
    --surface: #151c2c;
    --ink: #e8ecf5;
    --ink-2: #a0abc1;
    --line: #27314a;
    --on-accent: #0b1020;
    --pen: #ff8d85;
    --acc-matura: #8fadff;
    --acc-matura-soft: #1c274b;
    --acc-studia: #5fd3b1;
    --acc-studia-soft: #11342d;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1320;
  --grid: rgba(140, 170, 255, 0.07);
  --surface: #151c2c;
  --ink: #e8ecf5;
  --ink-2: #a0abc1;
  --line: #27314a;
  --on-accent: #0b1020;
  --pen: #ff8d85;
  --acc-matura: #8fadff;
  --acc-matura-soft: #1c274b;
  --acc-studia: #5fd3b1;
  --acc-studia-soft: #11342d;
  --shadow: none;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  background-position: -1px -1px;
  color: var(--ink);
  font: 400 1rem/1.55 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
.sr {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.page[data-section="studia"] {
  --accent: var(--acc-studia);
  --accent-soft: var(--acc-studia-soft);
}
.page {
  max-width: 2400px;
  margin-inline: auto;
  padding-inline: clamp(16px, 3.5vw, 56px);
  padding-block: clamp(28px, 6vw, 56px) 40px;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* nagłówek */
.masthead {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: 24px 48px; margin-bottom: 32px;
}
.masthead-text { flex: 1 1 420px; min-width: 0; }
.eyebrow {
  margin: 0 0 14px; font: 500 0.75rem/1 var(--f-mono);
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
}
h1 {
  margin: 0 0 14px; font: 600 clamp(2.1rem, 6vw, 3.4rem)/1.05 var(--f-display);
  letter-spacing: -0.01em; text-wrap: balance;
}
.lead { margin: 0; max-width: 52ch; font-size: 1.0625rem; color: var(--ink-2); text-wrap: balance; }
.plot { flex: 0 1 clamp(360px, 26vw, 560px); width: 100%; max-width: clamp(360px, 26vw, 560px); height: auto; }
.plot-axis { fill: none; stroke: var(--ink-2); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.plot-curve { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.plot-tangent { stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 5 4; }
.plot-drop { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 3; }
.plot-point { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }
.plot-label { font: italic 500 13px var(--f-display); fill: var(--ink-2); }
@media (max-width: 760px) { .plot { display: none; } }

/* zakładki */
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 20px 28px; margin-bottom: 20px; }
.switch { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; flex: 1 1 520px; max-width: 880px; min-width: 0; }
.tab {
  --tab-accent: var(--acc-matura);
  appearance: none; display: flex; align-items: center; gap: 14px; min-width: 0;
  padding: 14px 16px; text-align: left; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: var(--shadow); cursor: pointer;
  transition: background-color 0.15s, border-color 0.15s, color 0.15s;
}
.tab[data-section="studia"] { --tab-accent: var(--acc-studia); }
.tab:hover { border-color: var(--tab-accent); }
.tab:focus-visible { outline-color: var(--tab-accent); outline-offset: 3px; }
.tab[aria-selected="true"] { background: var(--tab-accent); border-color: var(--tab-accent); color: var(--on-accent); }
.tab-glyph {
  flex: none; width: 1.3em; text-align: center;
  font: italic 500 2rem/1 var(--f-display); color: var(--tab-accent);
}
.tab-label { min-width: 0; }
.tab-name { display: block; font: 600 1.25rem/1.15 var(--f-display); text-wrap: balance; }
.tab-sub { display: block; margin-top: 4px; font: 400 0.75rem/1.4 var(--f-mono); color: var(--ink-2); }
.tab[aria-selected="true"] .tab-glyph,
.tab[aria-selected="true"] .tab-sub { color: inherit; }
@media (max-width: 480px) {
  .tab { flex-direction: column; align-items: flex-start; gap: 6px; }
  .tab-glyph { width: auto; font-size: 1.6rem; }
  .tab-name { font-size: 1.125rem; }
}

/* wyszukiwarka */
.toolbar { display: flex; flex: 1 1 520px; flex-wrap: wrap; align-items: center; gap: 12px 20px; min-width: 0; }
.search { position: relative; flex: 1 1 300px; max-width: 800px; min-width: 0; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-2); pointer-events: none; }
.search input {
  width: 100%; padding: 11px 14px 11px 40px; font: inherit; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
}
.search input::placeholder { color: var(--ink-2); opacity: 0.85; }
.search input:focus-visible { border-color: var(--accent); outline-offset: 1px; }
.only { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--ink-2); cursor: pointer; }
.only input { width: 1rem; height: 1rem; margin: 0; accent-color: var(--accent); }

/* ostatnio dodane */
.recent { margin-bottom: 24px; }
.recent-title {
  margin: 0 0 10px; font: 500 0.75rem/1 var(--f-mono);
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2);
}
.recent-list {
  list-style: none; margin: 0; padding: 0; display: grid; gap: 10px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
@media (min-width: 900px) { .recent-list { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 520px) {
  .recent-list { grid-template-columns: minmax(0, 1fr); }
  .recent-list li:nth-child(n+3) { display: none; }
}
.recent-item {
  display: grid; gap: 6px; height: 100%; min-width: 0; padding: 12px 14px;
  color: var(--ink); text-decoration: none; background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow);
}
.recent-item:hover { border-color: var(--accent); }
.recent-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.recent-top svg { color: var(--accent); }
.recent-title-text { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.recent-ctx { font-size: 0.8125rem; color: var(--ink-2); overflow-wrap: anywhere; }

/* panele i karty */
.intro { margin: 8px 0 16px; max-width: 90ch; color: var(--ink-2); }
.grid {
  display: grid; gap: clamp(14px, 1.2vw, 22px);
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr));
}
.card {
  display: flex; flex-direction: column; gap: 14px; min-width: 0;
  padding: 20px 20px 16px; scroll-margin-top: 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow);
}
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.card-id { min-width: 0; }
.kicker {
  margin: 0 0 8px; font: 500 0.75rem/1 var(--f-mono);
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
}
.card-title { margin: 0; font: 600 1.375rem/1.2 var(--f-display); text-wrap: balance; }
.count {
  flex: none; padding: 5px 8px; font: 500 0.75rem/1 var(--f-mono);
  color: var(--accent); background: var(--accent-soft); border-radius: 4px;
}
.formula {
  display: flex; align-items: center; justify-content: center; min-height: 68px;
  padding: 10px 12px; overflow-x: auto; overflow-wrap: anywhere;
  font-size: 1.1rem; color: var(--ink); background: var(--accent-soft); border-radius: 4px;
}
html:not(.math-ready) .formula { color: transparent; }
html.math-failed .formula { display: none; }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.item { position: relative; padding-left: 18px; font-size: 0.96875rem; }
.item::before {
  content: ""; position: absolute; left: 0; top: 0.6em; width: 7px; height: 7px;
  border: 1.5px solid var(--accent); border-radius: 1px;
}
.card-foot {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  margin-top: auto; padding-top: 12px; border-top: 1px dashed var(--line);
}
.foot-label { font: 500 0.75rem/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
.pending { display: inline-flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--ink-2); }

/* działy bez materiałów: znacznik "Wkrótce" i wyciszona karta */
.soon {
  flex: none; padding: 5px 8px; font: 600 0.6875rem/1 var(--f-mono); letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--amber); background: var(--amber-soft); border-radius: 4px;
}
.card.is-soon { border-style: dashed; box-shadow: none; }
.card.is-soon .formula { opacity: 0.7; }

/* wyniki wyszukiwania w treści: gdzie dokładnie znaleziono szukane słowa */
.hits {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 10px;
  background: var(--accent-soft); border-radius: 4px;
}
.hit-list { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.hit {
  appearance: none; max-width: 100%; padding: 4px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: 500 0.8125rem/1.3 var(--f-body); color: var(--accent); background: var(--surface);
  border: 1px solid var(--accent); border-radius: 999px; cursor: pointer;
}
.hit:hover { color: var(--on-accent); background: var(--accent); }
.hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hit-more { font: 500 0.75rem/1 var(--f-mono); color: var(--ink-2); }

/* pliki PDF */
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.item .files { margin-top: 6px; }
.file {
  display: inline-flex; flex-direction: column; gap: 3px; max-width: 100%;
  padding: 6px 10px 6px 8px; font-size: 0.8125rem; line-height: 1.3;
  color: var(--ink); text-decoration: none; background: var(--surface);
  border: 1px solid var(--line); border-radius: 4px;
}
.file:hover { border-color: var(--accent); background: var(--accent-soft); }
.file-top { display: flex; align-items: center; gap: 8px; }
.file svg { flex: none; color: var(--accent); }
.file-type { font-weight: 600; }
.file-title { padding-left: 24px; line-height: 1.35; overflow-wrap: anywhere; }
.file-meta { font: 400 0.6875rem/1.3 var(--f-mono); color: var(--ink-2); }
.badge-new {
  padding: 2px 4px; font: 600 0.625rem/1 var(--f-mono); letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--pen); border: 1px solid currentColor; border-radius: 3px;
  transform: rotate(-3deg);
}
.empty {
  margin: 8px 0; padding: 24px; color: var(--ink-2);
  background: var(--surface); border: 1px dashed var(--line); border-radius: 6px;
}
.empty p { margin: 0 0 8px; }
.empty button {
  padding: 0; font: inherit; color: var(--accent); background: none; border: 0;
  text-decoration: underline; cursor: pointer;
}

/* przycisk zadań na karcie */
.card-foot { flex-direction: column; align-items: stretch; gap: 10px; }
.foot-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; }
.tasks-btn {
  appearance: none; display: inline-flex; align-items: center; gap: 8px; margin-left: auto;
  padding: 7px 8px 7px 12px; font: 500 0.8125rem/1.2 var(--f-body); color: var(--on-accent);
  background: var(--accent); border: 1px solid var(--accent); border-radius: 4px; cursor: pointer;
}
.tasks-btn:hover { filter: brightness(1.1); }
.tasks-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tasks-btn svg { flex: none; }
.tasks-n {
  padding: 2px 6px; font: 600 0.6875rem/1.3 var(--f-mono);
  color: var(--accent); background: var(--on-accent); border-radius: 3px;
}

/* okno z zadaniami z arkuszy CKE */
html.dialog-open { overflow: hidden; }
dialog.tasks {
  box-sizing: border-box; padding: 0; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px;
  width: min(980px, calc(100vw - 32px)); max-width: none;
  height: min(94vh, 1500px); max-height: none; overflow: hidden;
  box-shadow: 0 24px 64px rgba(14, 19, 32, 0.4);
}
dialog.tasks:not([open]) { display: none; }
dialog.tasks::backdrop { background: rgba(14, 19, 32, 0.62); }
.tasks-shell { display: flex; flex-direction: column; height: 100%; }
.tasks-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 16px 20px 14px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.tasks-head .kicker { margin-bottom: 8px; }
.tasks-title { margin: 0; font: 600 1.5rem/1.15 var(--f-display); text-wrap: balance; }
.tasks-close {
  appearance: none; flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; padding: 0; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
}
.tasks-close:hover { border-color: var(--accent); color: var(--accent); }
.tasks-body {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 16px 20px 32px;
}
.tasks-note { margin: 0 0 4px; max-width: 70ch; font-size: 0.8125rem; color: var(--ink-2); }
.tk-group {
  display: flex; align-items: center; gap: 12px; margin: 24px 0 12px;
  font: 500 0.75rem/1.2 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
}
.tk-group::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.tk-group:first-of-type { margin-top: 18px; }
.tk {
  margin: 0 0 16px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; box-shadow: var(--shadow); scroll-margin-top: 8px;
}
.tk-head {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
  padding: 10px 16px; border-bottom: 1px solid var(--line);
}
.tk-title { margin: 0; font: 600 1.125rem/1.2 var(--f-display); }
.pts {
  padding: 2px 6px; font: 600 0.6875rem/1.3 var(--f-mono);
  color: var(--accent); background: var(--accent-soft); border-radius: 3px;
}
.tk-src { margin-left: auto; font: 400 0.75rem/1.3 var(--f-mono); color: var(--ink-2); text-align: right; }
.tk-q { padding: 12px 16px 4px; font-size: 1rem; }
.tk-q p, .tk-panel p { margin: 0 0 8px; }
.tk-q ul, .tk-q ol, .tk-panel ul, .tk-panel ol { margin: 0 0 8px; padding-left: 22px; }
.tk-tags { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 2px 16px 8px; }
.tk-tag { font: 400 0.6875rem/1.4 var(--f-mono); color: var(--ink-2); }
.tk-tag + .tk-tag::before { content: "·"; margin-right: 6px; }
.tk-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 16px 14px; }
.tk-btn {
  appearance: none; padding: 6px 12px; font: 500 0.8125rem/1.2 var(--f-body);
  color: var(--accent); background: var(--surface); border: 1px solid var(--accent);
  border-radius: 999px; cursor: pointer;
}
.tk-btn:hover { background: var(--accent-soft); }
.tk-btn[aria-expanded="true"] { color: var(--on-accent); background: var(--accent); }
.tk-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* zaliczanie zadań (zapis w przeglądarce) i kopiowanie linku do zadania */
.tk-act-r { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.tk-btn.has-ico { display: inline-flex; align-items: center; gap: 6px; }
.tk-btn.has-ico svg { flex: none; }
.tk-done-btn { color: var(--acc-studia); border-color: var(--acc-studia); }
.tk-done-btn:hover { background: var(--acc-studia-soft); }
.tk-done-btn[aria-pressed="true"] { color: var(--on-accent); background: var(--acc-studia); }
.tk-done-btn[aria-pressed="true"]:hover { background: var(--acc-studia); filter: brightness(1.08); }
.tk-done-btn:focus-visible { outline-color: var(--acc-studia); }
.tk-link-btn[data-state] { color: var(--on-accent); background: var(--accent); }
.tk-done {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px;
  font: 600 0.6875rem/1.3 var(--f-mono); color: var(--acc-studia); background: var(--acc-studia-soft); border-radius: 3px;
}
.tk.is-done { border-left: 3px solid var(--acc-studia); }
.tk-progress { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin: 8px 0 0; font-size: 0.8125rem; color: var(--ink-2); }
.tk-bar { flex: 0 1 220px; min-width: 90px; height: 6px; overflow: hidden; background: var(--line); border-radius: 3px; }
.tk-bar > span { display: block; height: 100%; background: var(--acc-studia); border-radius: 3px; transition: width 0.2s; }
.tk-clear { appearance: none; padding: 0; font: inherit; color: var(--accent); background: none; border: 0; text-decoration: underline; cursor: pointer; }

/* teoria w oknie materiałów */
:root {
  --pen-soft: #fdecea; --violet: #6b3fb8; --violet-soft: #efe8fb;
  --teal: #0b7285; --teal-soft: #e0f3f6; --amber: #a85d0a; --amber-soft: #fcefd9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pen-soft: #3a2024; --violet: #c4a3ff; --violet-soft: #2a2145;
    --teal: #66d0e0; --teal-soft: #11323a; --amber: #f2b45f; --amber-soft: #3a2a12;
  }
}
:root[data-theme="dark"] {
  --pen-soft: #3a2024; --violet: #c4a3ff; --violet-soft: #2a2145;

.tasks-tab {
  appearance: none; margin-bottom: -1px; padding: 10px 14px 9px; cursor: pointer;

.pane[hidden] { display: none; }

.th-body h3::before { content: attr(data-n) "."; margin-right: 0.5em; font-style: italic; color: var(--accent); }
.th-body h4 { margin: 18px 0 6px; font: 600 0.9375rem/1.3 var(--f-body); color: var(--accent); }

.bx { margin: 12px 0; padding: 10px 14px 6px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--k, var(--accent)); border-radius: 0 6px 6px 0; }
.bx > .t { display: block; margin-bottom: 6px; font: 600 0.6875rem/1 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--k, var(--accent)); }
.bx > :last-child { margin-bottom: 4px; }
.bx.def { --k: var(--accent); background: var(--accent-soft); }
.bx.thm { --k: var(--violet); background: var(--violet-soft); }
.bx.fact { --k: var(--teal); background: var(--teal-soft); }
.bx.cor { --k: var(--amber); background: var(--amber-soft); }

.bx.ex { --k: var(--ink-2); background: var(--surface); }

.tw { margin: 8px 0 12px; overflow-x: auto; }
.wide { overflow-x: auto; overflow-y: hidden; max-width: 100%; }

}

@media (prefers-reduced-motion: reduce) {

}

<script>
(function () {
  'use strict';

  const SITE = window.SITE || {};
  const TYPE_LABEL = { teoria: 'Teoria', zadania: 'Zadania', rozwiazania: 'Rozwiązania', arkusz: 'Arkusz' };
  const NEW_DAYS = 14;
  const SVG_ATTRS = 'viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"';
  const ICON = {
    pdf: '<svg ' + SVG_ATTRS + '><path d="M4 1.75h5.2L12.5 5v9.25H4z"/><path d="M9 1.75V5h3.5"/><path d="M6.2 9.4h4M6.2 11.7h2.8"/></svg>',
    pencil: '<svg ' + SVG_ATTRS + '><path d="M2.75 13.25l.65-2.9 7.6-7.6a1.2 1.2 0 0 1 1.7 0l.55.55a1.2 1.2 0 0 1 0 1.7l-7.6 7.6z"/><path d="M9.6 4.2l2.2 2.2"/></svg>',
    book: '<svg ' + SVG_ATTRS + '><path d="M8 4.2C6.8 3.3 5 3 2.75 3v9.2c2.25 0 4.05.3 5.25 1.2 1.2-.9 3-1.2 5.25-1.2V3C11 3 9.2 3.3 8 4.2z"/><path d="M8 4.2v9.2"/></svg>',
    tasks: '<svg ' + SVG_ATTRS + '><path d="M5.5 2.25h5v2h-5z"/><path d="M4.25 3.5h-.5a1.25 1.25 0 0 0-1.25 1.25v8.5a1.25 1.25 0 0 0 1.25 1.25h8.5a1.25 1.25 0 0 0 1.25-1.25v-8.5a1.25 1.25 0 0 0-1.25-1.25h-.5"/><path d="M5.2 9l1.7 1.7 3.4-3.6"/></svg>',
    check: '<svg ' + SVG_ATTRS + '><path d="M3.25 8.5l3.2 3.2 6.3-6.9"/></svg>',
    link: '<svg ' + SVG_ATTRS + '><path d="M6.6 9.4a2.7 2.7 0 0 0 3.8 0l2.2-2.2a2.7 2.7 0 0 0-3.8-3.8l-.7.7"/><path d="M9.4 6.6a2.7 2.7 0 0 0-3.8 0L3.4 8.8a2.7 2.7 0 0 0 3.8 3.8l.7-.7"/></svg>'
  };

  const $ = (id) => document.getElementById(id);
  const page = $('page'), tabsEl = $('tabs'), panelsEl = $('panels'), qEl = $('q');
  const onlyEl = $('only'), onlyWrap = $('only-wrap'), recentEl = $('recent'), recentList = $('recent-list');

  // spójniki jednoliterowe nie zostają na końcu wiersza
  const tidy = (s) => String(s == null ? '' : s)
    .replace(/(^|[\s(„])([aiouwzAIOUWZ]) /g, '$1$2 ')
    .replace(/(^|[\s(„])([aiouwzAIOUWZ]) /g, '$1$2 ');
  const norm = (s) => String(s).toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[̀-ͯ]/g, '');
  const plural = (n, f) => (n === 1 ? f[0] : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? f[1] : f[2]);
  const parseDate = (s) => { const d = new Date(String(s) + 'T00:00:00'); return isNaN(d) ? null : d; };
  const fmtDate = (s) => {
    const d = parseDate(s);
    if (!d) return '';
    const same = d.getFullYear() === new Date().getFullYear();
    return d.toLocaleDateString('pl-PL', same ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' });
  };
  const isNew = (s) => { const d = parseDate(s); return !!d && (Date.now() - d.getTime()) / 864e5 <= NEW_DAYS; };

  function el(tag, attrs) {
    const node = document.createElement(tag);
    for (const k in (attrs || {})) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else node.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of [].slice.call(arguments, 2).flat()) if (kid != null && kid !== false) node.append(kid);
    return node;
  }
  function icon(name) {
    const s = el('span', { class: 'ico', 'aria-hidden': 'true' });
    s.style.display = 'inline-flex';
    s.innerHTML = ICON[name];
    return s;
  }

  let model = [], registry = [], tabEls = {}, panelEls = {}, topicIndex = {}, hasRecent = false;
  const state = { section: null, query: '', only: false };

  function normalise() {
    const data = window.MATERIALS || {};
    return Object.keys(data).map((id) => {
      const sec = data[id] || {};
      const out = {
        id: id, name: sec.name || id, glyph: sec.glyph || '', unit: sec.unit || 'Dział',
        units: sec.units || ['dział', 'działy', 'działów'], intro: sec.intro || '',
        topics: (sec.topics || []).map((t, i) => ({
          n: i + 1, id: id + '-' + (i + 1), title: t.title || '', formula: t.formula || '', files: t.files || [],
          tasks: (window.TASKS && window.TASKS[id + '-' + (i + 1)]) || [],
          theory: (window.THEORY && window.THEORY[id + '-' + (i + 1)]) || '',
          items: (t.items || []).map((it) => (typeof it === 'string'
            ? { title: it, files: [] }
            : { title: it.title || '', files: it.files || [] }))
        }))
      };
      out.fileCount = out.topics.reduce((n, t) => n + t.files.length + t.items.reduce((m, it) => m + it.files.length, 0), 0);
      out.taskCount = out.topics.reduce((n, t) => n + t.tasks.length, 0);
      out.theoryCount = out.topics.reduce((n, t) => n + (t.theory ? 1 : 0), 0);
      out.tasksLabel = sec.tasksLabel || 'Zadania';
      out.tasksNote = sec.tasksNote || '';
      return out;
    });
  }

  function chip(f) {
    return el('a', {
      class: 'file', href: f.file, target: '_blank', rel: 'noopener',
      title: parseDate(f.date) ? 'Dodano ' + fmtDate(f.date) : null
    },
      el('span', { class: 'file-top' },
        icon('pdf'),
        el('span', { class: 'sr', text: 'PDF: ' }),
        el('span', { class: 'file-type', text: TYPE_LABEL[f.type] || 'PDF' }),
        f.pages ? el('span', { class: 'file-meta', text: f.pages + ' str.' }) : null,
        isNew(f.date) ? el('span', { class: 'badge-new', text: 'nowe' }) : null),
      f.title ? el('span', { class: 'file-title', text: tidy(f.title) }) : null);
  }

  function buildCard(sec, topic) {
    const itemEls = topic.items.map((it) => {
      const li = el('li', { class: 'item' }, el('span', { text: tidy(it.title) }));
      if (it.files.length) li.append(el('div', { class: 'files' }, it.files.map(chip)));
      return li;
    });
    const itemFiles = topic.items.reduce((n, it) => n + it.files.length, 0);
    const total = topic.files.length + itemFiles;

    const rows = [];
    if (topic.theory || topic.tasks.length) {
      topicIndex[topic.id] = { sec: sec, topic: topic };
      const btns = [];
      if (topic.theory) {
        const b = el('button', { class: 'tasks-btn theory-btn', type: 'button', 'aria-haspopup': 'dialog' },
          icon('book'), el('span', { text: 'Teoria' }));
        b.addEventListener('click', () => openMaterials(sec, topic, 'theory'));
        btns.push(b);
      }
      if (topic.tasks.length) {
        const chipEl = el('span', { class: 'tasks-n', text: String(topic.tasks.length) });
        const b = el('button', { class: 'tasks-btn', type: 'button', 'aria-haspopup': 'dialog' },
          icon('tasks'), el('span', { text: 'Zadania' }), chipEl);
        b.addEventListener('click', () => openMaterials(sec, topic, 'tasks'));
        topicIndex[topic.id].chip = chipEl;   // licznik zaliczonych zadań (refreshProgress)
        topicIndex[topic.id].btn = b;
        btns.push(b);
      }
      rows.push(el('div', { class: 'foot-row' },
        el('span', { class: 'foot-label', text: 'Na stronie' }), el('div', { class: 'foot-btns' }, btns)));
    }
    if (topic.files.length) {
      rows.push(el('div', { class: 'foot-row' },
        el('span', { class: 'foot-label', text: 'Cały dział' }),
        el('div', { class: 'files' }, topic.files.map(chip))));
    }
    let foot = null;
    const soon = !rows.length && !total;
    if (rows.length) {
      foot = el('footer', { class: 'card-foot' }, rows);
    } else if (soon) {
      foot = el('footer', { class: 'card-foot' },
        el('span', { class: 'pending' }, icon('pencil'), 'Materiały w przygotowaniu'));
    }

    // wypełniane przez applyFilter: miejsca, w których znaleziono szukane słowa (zadania, teoria)
    const hitsEl = el('div', { class: 'hits', hidden: true },
      el('span', { class: 'foot-label', text: 'Znaleziono w' }), el('div', { class: 'hit-list' }));

    const card = el('article', { class: soon ? 'card is-soon' : 'card', id: topic.id },
      el('header', { class: 'card-head' },
        el('div', { class: 'card-id' },
          el('p', { class: 'kicker', text: sec.unit + ' ' + String(topic.n).padStart(2, '0') }),
          el('h2', { class: 'card-title', text: tidy(topic.title) })),
        total ? el('span', { class: 'count', text: total + ' PDF' }) : (soon ? el('span', { class: 'soon', text: 'Wkrótce' }) : null)),
      topic.formula ? el('div', { class: 'formula', 'aria-hidden': 'true', text: '\\(\\displaystyle ' + topic.formula + '\\)' }) : null,
      el('ul', { class: 'items' }, itemEls),
      hitsEl,
      foot);

    const taskText = topic.tasks.map((t) => (t.group || '') + ' ' + (t.tags || []).join(' ')).join(' ');
    const theoryText = (topic.theory.match(/<h3[^>]*>[\s\S]*?<\/h3>/g) || []).map((h) => h.replace(/<[^>]*>/g, ' ')).join(' ');
    return {
      sec: sec.id, el: card, topic: topic, hitsEl: hitsEl, idx: null,
      titleN: norm(topic.title + ' ' + taskText + ' ' + theoryText),
      has: total > 0 || topic.tasks.length > 0 || !!topic.theory, itemHas: itemFiles > 0,
      items: topic.items.map((it, i) => ({ el: itemEls[i], textN: norm(it.title), has: it.files.length > 0 }))
    };
  }

  function buildTabs() {
    tabsEl.textContent = '';
    tabEls = {};
    for (const sec of model) {
      const btn = el('button', {
        class: 'tab', type: 'button', role: 'tab', id: 'tab-' + sec.id,
        'aria-controls': 'panel-' + sec.id, 'data-section': sec.id
      },
        el('span', { class: 'tab-glyph', 'aria-hidden': 'true', text: sec.glyph }),
        el('span', { class: 'tab-label' },
          el('span', { class: 'tab-name', text: sec.name }),
          el('span', { class: 'tab-sub', 'data-role': 'sub' })));
      btn.addEventListener('click', () => select(sec.id, { updateHash: true }));
      tabsEl.append(btn);
      tabEls[sec.id] = btn;
    }
  }

  // Siatka kart: liczbę kolumn dobieramy tak, by ostatni rząd nie zostawał prawie pusty, a karty
  // miały rozsądną szerokość (360-600 px). Poza tym zakresem działa układ z CSS (auto-fill).
  const gridRO = typeof ResizeObserver === 'function'
    ? new ResizeObserver((entries) => requestAnimationFrame(() => entries.forEach((e) => balanceGrid(e.target)))) : null;
  function balanceGrid(grid) {
    if (!grid || !grid.offsetParent) return;
    const n = [].filter.call(grid.children, (c) => !c.hidden).length;
    const gap = parseFloat(getComputedStyle(grid).columnGap) || 0;
    let best = 0, bestScore = Infinity;
    for (let c = 1; c <= 8 && n; c++) {
      const w = (grid.clientWidth - gap * (c - 1)) / c;
      if (w < 360 || w > 600) continue;
      const score = ((c - (n % c)) % c) * 1000 + Math.abs(w - 460);
      if (score < bestScore) { bestScore = score; best = c; }
    }
    grid.style.gridTemplateColumns = best ? 'repeat(' + best + ', minmax(0, 1fr))' : '';
  }
  function balanceGrids() {
    for (const id in panelEls) balanceGrid(panelEls[id].querySelector('.grid'));
  }

  function buildPanels() {
    panelsEl.textContent = '';
    panelEls = {};
    registry = [];
    topicIndex = {};
    if (gridRO) gridRO.disconnect();
    for (const sec of model) {
      const grid = el('div', { class: 'grid' });
      if (gridRO) gridRO.observe(grid);
      const clear = el('button', { type: 'button', text: 'Wyczyść wyszukiwanie' });
      clear.addEventListener('click', () => {
        qEl.value = ''; onlyEl.checked = false; state.query = ''; state.only = false; applyFilter(); qEl.focus();
      });
      const empty = el('div', { class: 'empty', hidden: true }, el('p', { 'data-role': 'msg' }), clear);
      const panel = el('section', {
        class: 'panel', id: 'panel-' + sec.id, role: 'tabpanel',
        'aria-labelledby': 'tab-' + sec.id, 'data-section': sec.id, hidden: true
      }, sec.intro ? el('p', { class: 'intro', text: tidy(sec.intro) }) : null, grid, empty);
      for (const topic of sec.topics) {
        const c = buildCard(sec, topic);
        grid.append(c.el);
        registry.push(c);
      }
      panelsEl.append(panel);
      panelEls[sec.id] = panel;
    }
  }

  function buildRecent() {
    const all = [];
    for (const sec of model) for (const t of sec.topics) {
      for (const f of t.files) all.push({ f: f, sec: sec, ctx: t.title, label: f.title || t.title });
      for (const it of t.items) for (const f of it.files) all.push({ f: f, sec: sec, ctx: t.title, label: f.title || it.title });
    }
    const list = all.filter((x) => parseDate(x.f.date))
      .sort((a, b) => String(b.f.date).localeCompare(String(a.f.date))).slice(0, 4);
    recentList.textContent = '';
    for (const x of list) {
      recentList.append(el('li', {},
        el('a', { class: 'recent-item', href: x.f.file, target: '_blank', rel: 'noopener' },
          el('span', { class: 'recent-top' },
            icon('pdf'),
            el('span', { class: 'file-type', text: TYPE_LABEL[x.f.type] || 'PDF' }),
            isNew(x.f.date) ? el('span', { class: 'badge-new', text: 'nowe' }) : null,
            el('span', { class: 'file-meta', text: fmtDate(x.f.date) })),
          el('span', { class: 'recent-title-text', text: tidy(x.label) }),
          el('span', { class: 'recent-ctx', text: x.sec.name + ' · ' + tidy(x.ctx) }))));
    }
    hasRecent = list.length > 0;
  }

  // ---- wyszukiwanie w treści zadań i teorii ----
  // Indeks (tekst bez znaczników HTML i bez TeX-a, znormalizowany tak jak tytuły) powstaje w czasie
  // bezczynności strony albo przy pierwszym zapytaniu. Słowa od 3 liter szukamy jako fragmentów,
  // dwuliterowe (np. "tg", "ln") tylko jako całe słowa, a jednoliterowych w treści nie szukamy.
  const plain = (html) => String(html == null ? '' : html)
    .replace(/<svg[\s\S]*?<\/svg>/g, ' ')
    .replace(/<[^>]*>/g, ' ')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&')
    .replace(/\\[()[\]]/g, ' ')
    .replace(/\\([a-zA-Z]+)/g, ' $1 ')
    .replace(/[{}^_\\]/g, ' ')
    .replace(/\s+/g, ' ');
  const wordRe = {};
  function inBody(text, w) {
    if (w.length >= 3) return text.includes(w);
    if (w.length < 2) return false;
    const re = wordRe[w] || (wordRe[w] = new RegExp('(?:^|[^a-z0-9])' + w.replace(/[^a-z0-9]/g, '\\$&') + '(?:$|[^a-z0-9])'));
    return re.test(text);
  }
  function contentIndex(c) {
    if (c.idx) return c.idx;
    const topic = c.topic;
    const tasks = topic.tasks.map((t, i) => ({
      n: i + 1, no: t.no || (i + 1), key: taskKey(t, i),
      q: norm(plain((t.group || '') + ' ' + (t.tags || []).join(' ') + ' ' + (t.q || ''))),
      sol: norm(plain((t.sol || '') + ' ' + (t.ans || '')))
    }));
    const theory = (topic.theory.match(/<h3[\s\S]*?(?=<h3|$)/g) || []).map((chunk, i) => ({
      n: i + 1,
      title: plain((chunk.match(/<h3[^>]*>([\s\S]*?)<\/h3>/) || [])[1]).trim(),
      textN: norm(plain(chunk))
    }));
    c.idx = {
      tasks: tasks, theory: theory,
      bodyN: tasks.map((t) => t.q + ' ' + t.sol).concat(theory.map((s) => s.textN)).join(' ')
    };
    return c.idx;
  }
  function findHits(c, words) {
    const idx = contentIndex(c), hits = [];
    for (const t of idx.tasks) {
      const inQ = words.every((w) => inBody(t.q, w));
      if (inQ || words.every((w) => inBody(t.q + ' ' + t.sol, w))) hits.push({ kind: 'tasks', n: t.n, key: t.key, label: 'Zadanie ' + t.no, sol: !inQ });
    }
    for (const s of idx.theory) {
      if (words.every((w) => inBody(s.textN, w))) hits.push({ kind: 'theory', n: s.n, label: 'Teoria: ' + s.title });
    }
    return hits;
  }
  function showHits(c, hits) {
    const box = c.hitsEl, list = box.querySelector('.hit-list');
    list.textContent = '';
    if (!hits.length) { box.hidden = true; return; }
    const shown = hits.filter((h) => h.kind === 'tasks').slice(0, 6).concat(hits.filter((h) => h.kind === 'theory').slice(0, 3));
    for (const h of shown) {
      const b = el('button', { class: 'hit', type: 'button', 'aria-haspopup': 'dialog', title: h.label }, h.label);
      b.addEventListener('click', () => openHit(c, h));
      list.append(b);
    }
    if (hits.length > shown.length) list.append(el('span', { class: 'hit-more', text: '+' + (hits.length - shown.length) }));
    box.hidden = false;
  }
  // otwiera okno na wybranym zadaniu lub fragmencie teorii; gdy słowa są tylko w rozwiązaniu, rozwija je
  function openHit(c, h) {
    const ref = topicIndex[c.topic.id];
    if (!ref) return;
    openMaterials(ref.sec, ref.topic, h.kind === 'theory' ? 'theory' : 'tasks', h.kind === 'theory' ? h.n : h.key);
    if (h.kind === 'tasks' && h.sol) {
      const b = document.querySelector('[data-panel="' + ('tk-' + c.topic.id + '-' + h.key + '-s').replace(/["\\]/g, '\\$&') + '"]');
      if (b && b.getAttribute('aria-expanded') !== 'true') b.click();
    }
  }

  function applyFilter() {
    const words = norm(state.query).split(/\s+/).filter(Boolean);
    const bodyWords = words.filter((w) => w.length >= 2);
    const only = state.only;
    const filtering = words.length > 0 || only;
    const shown = {};

    for (const c of registry) {
      const body = words.length ? contentIndex(c).bodyN : '';
      const hit = words.length === 0 || words.every((w) => c.titleN.includes(w) || inBody(body, w));
      let visibleItems = 0;
      for (const it of c.items) {
        const q = hit || words.every((w) => (c.titleN + ' ' + it.textN).includes(w));
        const f = !only || it.has || !c.itemHas;
        it.el.hidden = !(q && f);
        if (!it.el.hidden) visibleItems++;
      }
      const ok = c.items.length ? visibleItems > 0 : hit;
      c.el.hidden = !(ok && (!only || c.has));
      if (!c.el.hidden) shown[c.sec] = (shown[c.sec] || 0) + 1;
      showHits(c, !c.el.hidden && bodyWords.length ? findHits(c, bodyWords) : []);
    }

    for (const sec of model) {
      const n = shown[sec.id] || 0, total = sec.topics.length;
      tabEls[sec.id].querySelector('[data-role="sub"]').textContent = filtering
        ? 'Pasuje: ' + n + ' z ' + total
        : total + ' ' + plural(total, sec.units) + (sec.fileCount ? ' · ' + sec.fileCount + ' PDF' : '')
          + (sec.taskCount ? ' · ' + sec.taskCount + ' ' + plural(sec.taskCount, ['zadanie', 'zadania', 'zadań']) : '');
      const empty = panelEls[sec.id].querySelector('.empty');
      empty.hidden = !(filtering && n === 0);
      if (!empty.hidden) {
        const others = model.filter((s) => s.id !== sec.id && (shown[s.id] || 0) > 0).map((s) => s.name);
        let msg = words.length ? 'Nic nie pasuje do „' + state.query.trim() + '”.' : 'W tej zakładce nie ma jeszcze materiałów do pobrania.';
        if (others.length) msg += ' Wyniki są w zakładce: ' + others.join(', ') + '.';
        else if (words.length) msg += ' Spróbuj krótszego słowa.';
        empty.querySelector('[data-role="msg"]').textContent = msg;
      }
    }
    recentEl.hidden = filtering || !hasRecent;
    balanceGrids();
  }

  function select(id, opts) {
    opts = opts || {};
    if (!panelEls[id]) id = model[0] && model[0].id;
    if (!id) return;
    state.section = id;
    page.dataset.section = id;
    for (const sec of model) {
      const on = sec.id === id;
      tabEls[sec.id].setAttribute('aria-selected', on ? 'true' : 'false');
      tabEls[sec.id].tabIndex = on ? 0 : -1;
      panelEls[sec.id].hidden = !on;
    }
    balanceGrids();
    if (opts.updateHash) { try { history.replaceState(null, '', '#' + id); } catch (e) { /* podgląd bez historii */ } }
  }

  // ---- okno z zadaniami z arkuszy CKE ----
  const dlg = $('tasks'), dlgBody = $('tasks-body'), dlgTitle = $('tasks-title'), dlgKicker = $('tasks-kicker');
  const root = document.documentElement;
  let dlgTopic = null;

  // ---- zaliczone zadania (zapis w tej przeglądarce) ----
  // Zadanie rozpoznajemy po stałym polu id (zob. materials.js); bez id używamy pozycji ("p3"), więc
  // taki wpis traci zaliczenie po przestawieniu zadań. Stan: { "matura-4": { "6": 1, "7": 1 }, ... }.
  const DONE_KEY = 'jcobmath.done.v1';
  const taskKey = (t, i) => (t.id != null && t.id !== '' ? String(t.id) : 'p' + (i + 1));
  const readDone = () => {
    try { const v = JSON.parse(localStorage.getItem(DONE_KEY) || '{}'); return v && typeof v === 'object' ? v : {}; } catch (e) { return {}; }
  };
  let done = readDone();
  const saveDone = () => { try { localStorage.setItem(DONE_KEY, JSON.stringify(done)); } catch (e) { /* tryb prywatny: stan zostaje do zamknięcia karty */ } };
  const isDone = (topic, key) => !!(done[topic.id] && done[topic.id][key]);
  function setDone(topic, key, on) {
    const m = done[topic.id] || (done[topic.id] = {});
    if (on) m[key] = 1; else delete m[key];
    if (!Object.keys(m).length) delete done[topic.id];
    saveDone();
  }
  const doneCount = (topic) => topic.tasks.reduce((n, t, i) => n + (isDone(topic, taskKey(t, i)) ? 1 : 0), 0);

  // licznik na karcie działu ("3/14") oraz pasek postępu w otwartym oknie zadań
  function refreshProgress(topic) {
    const n = doneCount(topic), total = topic.tasks.length, ref = topicIndex[topic.id];
    if (ref && ref.chip) {
      ref.chip.textContent = n ? n + '/' + total : String(total);
      ref.btn.classList.toggle('is-complete', total > 0 && n === total);
      ref.btn.setAttribute('aria-label', n ? 'Zadania, zaliczone ' + n + ' z ' + total : 'Zadania: ' + total);
    }
    const bar = dlgTopic === topic.id ? $('tk-progress') : null;
    if (bar) {
      bar.querySelector('.tk-progress-text').textContent = 'Zaliczone: ' + n + ' z ' + total;
      bar.querySelector('.tk-bar > span').style.width = (total ? Math.round(100 * n / total) : 0) + '%';
      bar.querySelector('.tk-clear').hidden = !n;
    }
  }
  function paintTask(article, on) {
    article.classList.toggle('is-done', on);
    const btn = article.querySelector('.tk-done-btn'), badge = article.querySelector('.tk-done');
    if (btn) btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (badge) badge.hidden = !on;
  }
  function syncDialogTasks() {
    const ref = dlgTopic && topicIndex[dlgTopic];
    if (!ref) return;
    ref.topic.tasks.forEach((t, i) => {
      const key = taskKey(t, i), a = $('tk-' + ref.topic.id + '-' + key);
      if (a) paintTask(a, isDone(ref.topic, key));
    });
    refreshProgress(ref.topic);
  }
  const refreshAllProgress = () => model.forEach((sec) => sec.topics.forEach((t) => { if (t.tasks.length) refreshProgress(t); }));
  // zmiana zaliczeń w innej karcie przeglądarki
  window.addEventListener('storage', (e) => {
    if (e.key !== DONE_KEY && e.key !== null) return;
    done = readDone();
    refreshAllProgress();
    syncDialogTasks();
  });

  // ---- link do zadania ----
  const taskUrl = (topic, key) => location.href.split('#')[0].split('?')[0] + '#' + topic.id + '-zadania-' + key;
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((resolve, reject) => {
      const ta = el('textarea', { readonly: true, 'aria-hidden': 'true', style: 'position:fixed;left:-9999px;top:0' });
      ta.value = text;
      dlg.append(ta);   // w oknie modalnym kopiować można tylko z elementu wewnątrz okna
      ta.select();
      try { if (document.execCommand('copy')) resolve(); else reject(new Error('copy')); } catch (err) { reject(err); } finally { ta.remove(); }
    });
  }
  function flashLink(btn, ok, num) {
    const lbl = btn.querySelector('.lbl');
    lbl.textContent = ok ? 'Skopiowano' : 'Nie udało się';
    btn.dataset.state = ok ? 'copied' : 'error';
    $('tk-live').textContent = ok ? 'Skopiowano link do zadania ' + num : 'Nie udało się skopiować linku';
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { lbl.textContent = 'Link'; delete btn.dataset.state; }, 1800);
  }

  function whenMath(fn) {
    if (root.classList.contains('math-ready') && window.MathJax && window.MathJax.typesetPromise) fn();
    else document.addEventListener('math-ready', fn, { once: true });
  }
  // bardzo długi wzór w tekście: akapit dostaje własne przewijanie poziome zamiast poszerzać okno
  function fitWide(node) {
    if (!node || node.hidden) return;
    [].forEach.call(node.querySelectorAll('mjx-container:not([display="true"])'), function (m) {
      const p = m.closest('p, li, .ans, .tk-panel');
      if (p && !p.classList.contains('wide') && m.getBoundingClientRect().width > p.clientWidth) p.classList.add('wide');
    });
  }
  function typesetIn(node) {
    whenMath(function () { window.MathJax.typesetPromise([node]).then(function () { fitWide(node); }).catch(function () {}); });
  }

  // spójniki jednoliterowe w treści zadań, z pominięciem wzorów
  function tidyTree(node) {
    const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    for (let n = walker.nextNode(); n; n = walker.nextNode()) nodes.push(n);
    nodes.forEach((n) => {
      const parts = n.nodeValue.split(/(\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\])/);
      for (let i = 0; i < parts.length; i += 2) parts[i] = tidy(parts[i]);
      n.nodeValue = parts.join('');
    });
  }

  function taskEl(topic, t, i) {
    const key = taskKey(t, i);
    const id = 'tk-' + topic.id + '-' + key;
    const q = el('div', { class: 'tk-q' });
    q.innerHTML = t.q || '';
    if (t.fig) {
      const fw = el('div', { class: 'fig-wrap' });
      fw.innerHTML = t.fig;
      q.append(fw);
    }
    const kids = [
      el('header', { class: 'tk-head' },
        el('h3', { class: 'tk-title', text: 'Zadanie ' + (t.no || (i + 1)) }),
        t.pts ? el('span', { class: 'pts', text: t.pts + ' pkt' }) : null,
        el('span', { class: 'tk-done', hidden: true }, icon('check'), 'Zaliczone'),
        (t.label || t.src) ? el('span', { class: 'tk-src', text: t.label || ('CKE · matura ' + t.src) }) : null),
      q
    ];
    if (t.tags && t.tags.length) {
      kids.push(el('div', { class: 'tk-tags' }, t.tags.map((x) => el('span', { class: 'tk-tag', text: x }))));
    }
    const actions = el('div', { class: 'tk-actions' }), panels = [];
    const add = (key, label, html) => {
      if (!html) return;
      const pid = id + '-' + key;
      actions.append(el('button', {
        class: 'tk-btn', type: 'button', 'aria-expanded': 'false', 'aria-controls': pid, 'data-panel': pid
      }, label));
      const p = el('div', { class: 'tk-panel', id: pid, hidden: true });
      p.innerHTML = html;
      panels.push(p);
    };
    add('a', 'Odpowiedź', t.ans);
    add('s', 'Rozwiązanie', t.sol ? t.sol + (t.ans ? '<div class="ans"><span class="l">Odpowiedź</span>' + t.ans + '</div>' : '') : '');
    const doneBtn = el('button', {
      class: 'tk-btn tk-done-btn has-ico', type: 'button', 'aria-pressed': 'false',
      title: 'Zaznacz zadanie jako zaliczone (zapisane w tej przeglądarce)'
    }, icon('check'), el('span', { text: 'Zalicz' }));
    const linkBtn = el('button', { class: 'tk-btn tk-link-btn has-ico', type: 'button', title: 'Skopiuj link do tego zadania' },
      icon('link'), el('span', { class: 'lbl', text: 'Link' }));
    actions.append(el('span', { class: 'tk-act-r' }, doneBtn, linkBtn));
    kids.push(actions);
    const article = el('article', { class: 'tk', id: id }, kids, panels);
    doneBtn.addEventListener('click', () => {
      const on = doneBtn.getAttribute('aria-pressed') !== 'true';
      setDone(topic, key, on);
      paintTask(article, on);
      refreshProgress(topic);
    });
    linkBtn.addEventListener('click', () => {
      copyText(taskUrl(topic, key)).then(() => flashLink(linkBtn, true, t.no || (i + 1)), () => flashLink(linkBtn, false));
    });
    paintTask(article, isDone(topic, key));
    return article;
  }

  function theoryPane(topic) {
    const pane = el('div', { class: 'pane th', id: 'pane-theory', role: 'tabpanel', hidden: true });
    const body = el('div', { class: 'th-body' });
    body.innerHTML = topic.theory;
    const heads = [].slice.call(body.querySelectorAll('h3'));
    heads.forEach((h, i) => { h.id = 'th-' + topic.id + '-' + (i + 1); h.setAttribute('data-n', String(i + 1)); });
    if (heads.length > 2) {
      const list = el('ol');
      heads.forEach((h, i) => {
        const a = el('a', { 'data-th': h.id, text: h.textContent });
        list.append(el('li', {}, a));
      });
      pane.append(el('nav', { class: 'th-toc', 'aria-label': 'Spis treści' }, el('p', { class: 'th-toc-title', text: 'Spis treści' }), list));
      pane.classList.add('has-toc');
    }
    pane.append(body);
    return pane;
  }

  function tasksPane(sec, topic) {
    const pane = el('div', { class: 'pane', id: 'pane-tasks', role: 'tabpanel', hidden: true });
    if (sec.tasksNote) pane.append(el('p', { class: 'tasks-note', text: sec.tasksNote }));
    // pasek postępu: ile zadań z tego działu zaliczono; "Wyczyść" wymaga drugiego kliknięcia
    const clearBtn = el('button', { class: 'tk-clear', type: 'button', text: 'Wyczyść zaliczenia', hidden: true });
    let armed = null;
    const disarm = () => { clearTimeout(armed); delete clearBtn.dataset.armed; clearBtn.textContent = 'Wyczyść zaliczenia'; };
    clearBtn.addEventListener('click', () => {
      if (!clearBtn.dataset.armed) {
        clearBtn.dataset.armed = '1';
        clearBtn.textContent = 'Na pewno? Kliknij ponownie';
        armed = setTimeout(disarm, 4000);
        return;
      }
      disarm();
      delete done[topic.id];
      saveDone();
      syncDialogTasks();
    });
    pane.append(el('div', { class: 'tk-progress', id: 'tk-progress' },
      el('span', { class: 'tk-progress-text' }), el('span', { class: 'tk-bar', 'aria-hidden': 'true' }, el('span')), clearBtn));
    let group = null;
    topic.tasks.forEach((t, i) => {
      if (t.group && t.group !== group) { group = t.group; pane.append(el('h4', { class: 'tk-group', text: group })); }
      pane.append(taskEl(topic, t, i));
    });
    return pane;
  }

  function buildMaterials(sec, topic) {
    dlgBody.textContent = '';
    const tabsEl2 = $('tasks-tabs');
    tabsEl2.textContent = '';
    const kinds = [];
    if (topic.theory) kinds.push(['theory', 'Teoria', theoryPane(topic)]);
    if (topic.tasks.length) kinds.push(['tasks', sec.tasksLabel || 'Zadania', tasksPane(sec, topic), topic.tasks.length]);
    kinds.forEach((k) => {
      dlgBody.append(k[2]);
      const b = el('button', { class: 'tasks-tab', type: 'button', role: 'tab', id: 'tab-' + k[0], 'aria-controls': 'pane-' + k[0], 'data-tab': k[0] },
        k[1], k[3] ? el('span', { class: 'n', text: String(k[3]) }) : null);
      tabsEl2.append(b);
    });
    tabsEl2.hidden = kinds.length < 2;
    dlg.classList.toggle('has-tabs', kinds.length > 1);
    tidyTree(dlgBody);
  }

  function showTab(tab) {
    const tabsEl2 = $('tasks-tabs');
    [].forEach.call(tabsEl2.children, (b) => {
      const on = b.getAttribute('data-tab') === tab;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    });
    ['theory', 'tasks'].forEach((k) => { const p = $('pane-' + k); if (p) p.hidden = k !== tab; });
    fitWide($('pane-' + tab));
  }

  function openMaterials(sec, topic, tab, num) {
    tab = tab === 'theory' && topic.theory ? 'theory' : (topic.tasks.length ? 'tasks' : 'theory');
    dlgKicker.textContent = sec.unit + ' ' + String(topic.n).padStart(2, '0') + (tab === 'theory' ? ' · Teoria' : ' · ' + (sec.tasksLabel || 'Zadania'));
    dlgTitle.textContent = tidy(topic.title);
    const fresh = dlgTopic !== topic.id;
    if (fresh) { buildMaterials(sec, topic); dlgTopic = topic.id; refreshProgress(topic); }
    showTab(tab);
    if (!dlg.open) {
      if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    }
    root.classList.add('dialog-open');
    if (fresh) typesetIn(dlgBody);
    const target = num ? $(tab === 'theory' ? 'th-' + topic.id + '-' + num : 'tk-' + topic.id + '-' + num) : null;
    if (target) target.scrollIntoView({ block: 'start' }); else dlgBody.scrollTop = 0;
    try { history.replaceState(null, '', '#' + topic.id + '-' + (tab === 'theory' ? 'teoria' : 'zadania') + (num ? '-' + num : '')); } catch (e) { /* podgląd bez historii */ }
  }

  $('tasks-tabs').addEventListener('click', (e) => {
    const b = e.target.closest ? e.target.closest('.tasks-tab') : null;
    const hit = dlgTopic && topicIndex[dlgTopic];
    if (b && hit) openMaterials(hit.sec, hit.topic, b.getAttribute('data-tab'));
  });
  dlgBody.addEventListener('click', (e) => {
    const link = e.target.closest ? e.target.closest('a[data-th]') : null;
    if (link) {
      const t = $(link.getAttribute('data-th'));
      if (t) t.scrollIntoView({ block: 'start' });
      return;
    }
    const b = e.target.closest ? e.target.closest('.tk-btn') : null;
    if (!b) return;
    const p = $(b.getAttribute('data-panel'));
    if (!p) return;
    const open = p.hidden;
    p.hidden = !open;
    b.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) fitWide(p);
  });
  dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
  $('tasks-close').addEventListener('click', () => dlg.close());
  dlg.addEventListener('close', () => {
    root.classList.remove('dialog-open');
    if (dlgTopic) { try { history.replaceState(null, '', '#' + dlgTopic); } catch (e) { /* podgląd bez historii */ } }
  });

  function applyHash() {
    const m = /^#([a-z]+)(?:-(\d+))?(?:-(zadania|teoria)(?:-([\w.-]+))?)?$/.exec(location.hash);
    if (!m || !panelEls[m[1]]) return false;
    select(m[1]);
    if (m[2]) {
      const target = document.getElementById(m[1] + '-' + m[2]);
      if (target) target.scrollIntoView({ block: 'start' });
      if (m[3]) {
        const hit = topicIndex[m[1] + '-' + m[2]];
        const theory = m[3] === 'teoria';
        if (hit) openMaterials(hit.sec, hit.topic, theory ? 'theory' : 'tasks', theory ? (+m[4] || 0) : resolveTaskKey(hit.topic, m[4]));
      }
    }
    return true;
  }
  // w adresie jest stały id zadania; starsze linki z numerem pozycji (#matura-4-zadania-6) też działają
  function resolveTaskKey(topic, s) {
    if (!s) return '';
    for (let i = 0; i < topic.tasks.length; i++) if (taskKey(topic.tasks[i], i) === s) return s;
    const pos = /^\d+$/.test(s) ? +s : 0;
    return pos >= 1 && pos <= topic.tasks.length ? taskKey(topic.tasks[pos - 1], pos - 1) : '';
  }

  function typeset() {
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise([panelsEl]).catch(function () {});
    }
  }

  function drawPlot() {
    const svg = $('plot');
    if (!svg) return;
    svg.textContent = '';
    const NS = 'http://www.w3.org/2000/svg';
    const mk = (tag, attrs, text) => {
      const n = document.createElementNS(NS, tag);
      for (const k in attrs) n.setAttribute(k, attrs[k]);
      if (text) n.textContent = text;
      svg.append(n);
      return n;
    };
    const ox = 40, oy = 78, amp = 44, k = 2 * Math.PI / 150;
    const f = (x) => oy - amp * Math.sin(k * (x - ox));
    mk('path', { d: 'M12 78H350M344 74l6 4-6 4', class: 'plot-axis' });
    mk('path', { d: 'M40 146V6M36 12l4-6 4 6', class: 'plot-axis' });
    for (let x = ox + 75; x <= 340; x += 75) mk('path', { d: 'M' + x + ' 75v6', class: 'plot-axis' });
    let d = '';
    for (let x = ox; x <= 340; x += 2) d += (d ? 'L' : 'M') + x + ' ' + f(x).toFixed(1);
    mk('path', { d: d, class: 'plot-curve' });
    const x0 = 100, y0 = f(x0), m = -amp * k * Math.cos(k * (x0 - ox)), h = 28;
    mk('line', { x1: x0 - h, y1: (y0 - h * m).toFixed(1), x2: x0 + h, y2: (y0 + h * m).toFixed(1), class: 'plot-tangent' });
    mk('line', { x1: x0, y1: y0.toFixed(1), x2: x0, y2: oy, class: 'plot-drop' });
    mk('circle', { cx: x0, cy: y0.toFixed(1), r: 4, class: 'plot-point' });
    mk('text', { x: 354, y: 98, class: 'plot-label' }, 'x');
    mk('text', { x: 47, y: 15, class: 'plot-label' }, 'y');
    mk('text', { x: x0 - 6, y: 96, class: 'plot-label' }, 'x₀');
  }

  function render() {
    dlgTopic = null;   // zawartość okna zadań budowana jest od nowa z odświeżonych danych
    model = normalise();
    buildTabs();
    buildPanels();
    buildRecent();
    if (!model.length) {
      panelsEl.append(el('p', { class: 'intro', text: 'Nie znaleziono danych w pliku materials.js.' }));
      return;
    }
    onlyWrap.hidden = !model.some((s) => s.fileCount > 0 || s.taskCount > 0);
    select(panelEls[state.section] ? state.section : model[0].id);
    applyFilter();
    refreshAllProgress();
    typeset();
    // indeks wyszukiwania w treści budujemy z wyprzedzeniem, żeby pierwsze zapytanie nie powodowało przycięcia
    const warm = () => registry.forEach((c) => contentIndex(c));
    if (window.requestIdleCallback) window.requestIdleCallback(warm, { timeout: 4000 }); else setTimeout(warm, 1500);
  }

  document.documentElement.lang = 'pl';
  if (SITE.title) { document.title = SITE.title; $('site-title').textContent = SITE.title; }
  $('site-lead').textContent = tidy(SITE.lead || '');
  if (SITE.contact) {
    const c = $('contact');
    c.textContent = 'Znalazłeś błąd albo brakuje Ci tematu? Napisz: ' + SITE.contact;
    c.hidden = false;
  }

  if (!gridRO) window.addEventListener('resize', balanceGrids);
  qEl.addEventListener('input', () => { state.query = qEl.value; applyFilter(); });
  onlyEl.addEventListener('change', () => { state.only = onlyEl.checked; applyFilter(); });
  tabsEl.addEventListener('keydown', (e) => {
    const ids = model.map((s) => s.id);
    let i = ids.indexOf(state.section);
    if (e.key === 'ArrowRight') i = (i + 1) % ids.length;
    else if (e.key === 'ArrowLeft') i = (i - 1 + ids.length) % ids.length;
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = ids.length - 1;
    else return;
    e.preventDefault();
    select(ids[i], { updateHash: true });
    tabEls[ids[i]].focus();
  });
  window.addEventListener('hashchange', () => {
    if (dlg.open && !/-(zadania|teoria)/.test(location.hash)) dlg.close();
    applyHash();
  });

  drawPlot();
  render();
  applyHash();
  window.MathSite = { reload: render };
})();
</script>
